# Configuration for Language Model evaluation

# ============================================================
# Setup
# ============================================================

seed: 42


# ============================================================
# Data
# ============================================================

data:
  dataset_path: /nethome/whisper/data/
  test_set: test_prague.csv
  text_column: sentence


# ============================================================
# Model
# ============================================================

model:
  name: gpt2
  path: ""


# ============================================================
# Tokenizer
# ============================================================

tokenizer:
  type: whisper_multi   # options: gpt2, whisper_en, whisper_multi
  whisper_model: medium
  whisper_path: openai/whisper-
  language: english
  task: transcribe
  no_timestamps: true


# ============================================================
# Generation
# ============================================================

evaluation:
  batch_size: 1


# ============================================================
# Output
# ============================================================

output:
  save_predictions: true
  path: results/