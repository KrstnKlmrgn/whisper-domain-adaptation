# Configuration for Whisper domain adaptation experiments

# ============================================================
# Setup
# ============================================================

seed: 42

experiment:
  name: tts_1


# ============================================================
# Data
# ============================================================

data:
  dataset_path: /path/to/data/
  train_set: data_vienna_shuffled.csv
  validation_set: dev_prague.csv

  audio_column: audio
  text_column: sentence
  sampling_rate: 16000

  # possible input types:
  # - spectrogram
  # - audio
  input_type: spectrogram


# ============================================================
# Whisper
# ============================================================

whisper:
  model: tiny
  path: openai/whisper-
  language: english
  task: transcribe


# ============================================================
# Approach
# ============================================================

model:

  # possible:
  # - whisper
  # - deep_fusion
  # - ilma
  type: deep_fusion


# ============================================================
# Deep Fusion
# ============================================================

deep_fusion:

  use_lm: true
  copy_weights: false
  gate_type: coarse

  lm:
    name: gpt2
    path: ""

  model:
    name: df_copyw_medium_NoLM_1e-05w100_coarse_train25p_pkv_dec
    path: models/deep_fusion/


# ============================================================
# ILMA
# ============================================================

ilma:
  dummy_input: random
  dummy_std: 0.05
  generator_seed: 333
  name: prague10


# ============================================================
# Freeze
# ============================================================

freeze:
  encoder: true
  decoder: false
  cross_attention: true
  decoder_except_embeddings: false


# ============================================================
# Training
# ============================================================

training:

  learning_rate: 1e-5
  warmup_steps: 500

  num_train_epochs: 1

  train_batch_size: 16
  eval_batch_size: 8
  gradient_accumulation_steps: 1

  fp16: true
  gradient_checkpointing: true

  optim: adamw_torch

  evaluation_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2

  logging_strategy: epoch
  report_to:
    - tensorboard

  load_best_model_at_end: true
  metric_for_best_model: wer
  greater_is_better: false

  predict_with_generate: true
  generation_max_length: 225

  push_to_hub: false

  early_stopping_patience: 10


# ============================================================
# Output
# ============================================================

output:
  path: results/